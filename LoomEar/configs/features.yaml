# LoomEar Feature Extraction Configuration
sample_rate: 16000

cycles:
  min_rpm: 120.0
  max_rpm: 400.0
  target_cycle_samples: 4000  # fixed length for normalized cycle (0.25s @ 16kHz approx)
  envelope_cutoff_hz: 30.0
  min_confidence: 0.35

handcrafted:
  time_domain:
    - rms
    - peak
    - crest_factor
    - kurtosis
    - skewness
    - zcr
    - impulse_factor
    - margin_factor
  frequency_domain:
    - spectral_centroid
    - spectral_bandwidth
    - spectral_rolloff
    - spectral_flatness
    - spectral_flux
    - band_energy_low (50-500Hz)
    - band_energy_mid (500-3000Hz)
    - band_energy_high (3000-7800Hz)
    - high_to_low_energy_ratio
  perceptual:
    n_mfcc: 13
    include_deltas: true
  cycle_synchronous:
    - impact_peak_offset_ratio
    - n_impact_peaks
    - cycle_to_cycle_rms_var
    - residual_energy_early
    - residual_energy_mid
    - residual_energy_late
    - template_correlation

spectrogram:
  n_fft: 1024
  hop_length: 256
  n_mels: 64
  f_min: 50.0
  f_max: 7800.0
  fixed_shape: [64, 64]
