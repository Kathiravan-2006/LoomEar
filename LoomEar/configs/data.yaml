# LoomEar Data Configuration
seed: 42
sample_rate: 16000
audio:
  min_duration_sec: 2.0
  max_duration_sec: 120.0
  target_sr: 16000
  channels: 1
  normalize_peak: 0.95
  bandpass:
    low_hz: 50.0
    high_hz: 7800.0
    order: 4
  noise_reduction:
    enabled: true
    prop_decrease: 0.85
    stationary: true

simulation:
  default_duration_sec: 10.0
  default_rpm: 210.0
  sample_rate: 16000
  machines:
    - id: "LOOM-01"
      type: "rapier"
      rpm: 210.0
      mic_pos: "35cm_drive_side"
    - id: "LOOM-02"
      type: "rapier"
      rpm: 215.0
      mic_pos: "40cm_drive_side"
    - id: "LOOM-03"
      type: "projectile"
      rpm: 195.0
      mic_pos: "45cm_weft_side"
    - id: "LOOM-04"
      type: "air-jet"
      rpm: 240.0
      mic_pos: "30cm_front_sley"
    - id: "LOOM-05"
      type: "rapier"
      rpm: 210.0
      mic_pos: "35cm_drive_side"
    - id: "LOOM-06"
      type: "rapier"
      rpm: 208.0
      mic_pos: "38cm_drive_side"
    - id: "LOOM-07"
      type: "air-jet"
      rpm: 245.0
      mic_pos: "30cm_front_sley"
    - id: "LOOM-08"
      type: "projectile"
      rpm: 190.0
      mic_pos: "45cm_weft_side"
  fault_types:
    - bearing_wear
    - timing_drift
    - belt_squeal
    - lubrication_loss
    - beatup_looseness
    - loose_frame
  snr_levels_db: [20, 15, 10, 5, 0]

splits:
  test_size: 0.25
  val_size: 0.20
  group_by: "session_id"
  lomo_target_machine: "LOOM-04"
